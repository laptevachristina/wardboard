<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#F4E3E6">
<title>WardBoard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7F4EE; --rose:#F4E3E6; --rose2:#EFD5DA;
  --olive:#6E7A4B; --graphite:#312F2C; --mist:#E8E5E0; --line:#DCD7CD;
  --bg:var(--paper); --head:var(--rose); --h:var(--olive); --text:var(--graphite); --win:var(--mist);
}
[data-theme="dark"]{
  --paper:#2B2926; --rose:#56603F; --rose2:#4A5337;
  --olive:#EBC9CE; --graphite:#FAF9F6; --mist:#393632;
  --bg:var(--paper); --head:var(--rose); --h:var(--olive); --text:var(--graphite); --win:var(--mist); --line:#4A4640;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:'Inter',sans-serif;font-weight:300;background:#E9E4DA;color:var(--text);display:flex;justify-content:center}
.app{position:relative;width:100%;max-width:430px;height:100dvh;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 80px rgba(0,0,0,.12)}
.paper-bg{position:absolute;inset:0;pointer-events:none;z-index:0;opacity:.5;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.012 0.012' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.55  0 0 0 0 0.5  0 0 0 0 0.42  0 0 0 0.5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
[data-theme="dark"] .paper-bg{opacity:.22;mix-blend-mode:screen}

header.top{position:relative;z-index:5;flex:none;background:var(--head);padding:11px 18px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:baseline;line-height:1}
.logo .w{font-family:'Pinyon Script',cursive;font-size:30px;color:var(--h)}
.logo .b{font-family:'Inter',sans-serif;font-weight:300;font-size:23px;color:var(--h);margin-left:6px}
.by{font-size:10px;letter-spacing:.18em;color:var(--h);opacity:.8;margin-top:2px}
.toggle{width:38px;height:38px;border-radius:12px;border:0;background:var(--win);color:var(--h);font-size:15px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.08);transition:transform .1s}
.toggle:active{transform:scale(.94)}
.top-btn{height:38px;border-radius:12px;border:0;background:var(--win);color:var(--h);font:500 12px 'Inter';cursor:pointer;padding:0 12px;display:inline-flex;align-items:center;gap:5px;box-shadow:0 2px 6px rgba(0,0,0,.08);transition:transform .1s}
.top-btn:active{transform:scale(.95)}

.tabs{position:relative;z-index:5;flex:none;display:flex;background:var(--paper);border-bottom:1px solid var(--line)}
.tabs button{flex:1;min-width:0;background:none;border:0;padding:11px 4px;font:500 11.5px 'Inter';color:var(--text);opacity:.5;cursor:pointer;border-bottom:2px solid transparent;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs button.on{opacity:1;color:var(--h);border-bottom-color:var(--h)}

.workspace{position:relative;z-index:2;flex:1;display:flex;overflow:hidden;min-height:0}
.tools{flex:none;width:52px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;background:var(--paper);border-right:1px solid var(--line)}
.tools button{width:46px;height:46px;border-radius:14px;border:0;background:var(--win);color:var(--text);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-direction:column;line-height:1;box-shadow:0 2px 7px rgba(0,0,0,.09);transition:transform .1s,background .15s}
.tools button:active{transform:scale(.93)}
.tools button.dl{background:var(--olive);color:#FAF9F6}
[data-theme="dark"] .tools button.dl{background:var(--h);color:#2B2926}
.tools button.dl small{color:rgba(255,255,255,.85)}
[data-theme="dark"] .tools button.dl small{color:rgba(43,41,38,.7)}
.tools button small{font-size:7px;opacity:.6;margin-top:1px;font-weight:400}
.tools .sep{width:26px;height:1px;background:var(--line);margin:3px 0}

.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:12px;overflow:hidden;position:relative}
.canvas{position:relative;height:100%;aspect-ratio:9/16;background:#FBF8F2;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.10);overflow:hidden}
[data-theme="dark"] .canvas{background:#322F2A}
.canvas>.hint{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--h);opacity:.45;text-align:center;padding:20px;font-family:'Cormorant Garamond',serif;font-size:16px;pointer-events:none}
.canvas>.hint span{font-size:30px;margin-bottom:6px}
.obj{position:absolute;cursor:grab;user-select:none;touch-action:none}
.obj.sel{outline:2px dashed var(--h);outline-offset:3px}
.obj .x{position:absolute;top:-11px;right:-11px;width:22px;height:22px;border-radius:50%;background:var(--rose);color:var(--h);border:1px solid var(--h);font-size:12px;display:none;align-items:center;justify-content:center;cursor:pointer}
.obj.sel .x{display:flex}
.obj.txt{font-family:'Cormorant Garamond',serif;color:var(--h);font-size:20px;white-space:nowrap;padding:2px 4px}
.obj.stk{font-size:30px}
.obj .ph{border-radius:10px;background:#E4DDCF}

footer.bottom{position:relative;z-index:5;flex:none;background:var(--paper);border-top:1px solid var(--line);padding:9px 12px calc(9px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center}
.fbtn{border:1px solid var(--line);background:var(--win);color:var(--text);border-radius:11px;padding:9px 13px;font:500 12px 'Inter';cursor:pointer}
.fbtn.primary{background:var(--olive);color:#FAF9F6;border-color:var(--olive)}
[data-theme="dark"] .fbtn.primary{background:var(--h);color:#2B2926;border-color:var(--h)}
.fspacer{margin-left:auto}

.drawer{position:absolute;z-index:30;top:0;right:0;bottom:0;width:86%;max-width:340px;background:var(--paper);border-left:1px solid var(--line);box-shadow:-14px 0 40px rgba(0,0,0,.18);transform:translateX(100%);transition:transform .28s;display:flex;flex-direction:column}
.drawer.on{transform:translateX(0)}
.drawer .dh-head{padding:13px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.drawer .dh{font-family:'Cormorant Garamond',serif;color:var(--h);font-size:22px;line-height:1}
.drawer .ds{font-size:11.5px;opacity:.6;margin-top:2px}
.drawer .toolbar{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.drawer .toolbar::-webkit-scrollbar{display:none}
.dd-btn{border:0;background:var(--win);color:var(--text);border-radius:11px;padding:8px 12px;font:500 11.5px 'Inter';cursor:pointer;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;box-shadow:0 2px 7px rgba(0,0,0,.09);transition:transform .1s}
.dd-btn:active{transform:scale(.95)}
.dd-btn .caret{opacity:.5;font-size:9px}
.drawer .body{flex:1;overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tile{aspect-ratio:3/4;border-radius:12px;position:relative;overflow:hidden;display:flex;align-items:flex-end;cursor:pointer}
.tile i{display:block;width:100%;padding:5px 7px;font-size:10px;font-style:normal;background:linear-gradient(transparent,rgba(0,0,0,.06))}
[data-theme="dark"] .tile i{background:linear-gradient(transparent,rgba(255,255,255,.07))}
.sw1{background:#E4DDCF}.sw2{background:#D6DEC4}.sw3{background:#F4E3E6}.sw4{background:#D8D6E2}.sw5{background:#CECECE}.sw6{background:#F2EFE8}
.tile.add{border:1.5px dashed var(--h);background:transparent;color:var(--h);align-items:center;justify-content:center;flex-direction:column;gap:3px;font-size:10px}
.tile.add span{font-size:22px}
.lc{background:var(--win);border-radius:13px;padding:13px;margin-bottom:9px}
.lc h3{font-family:'Cormorant Garamond',serif;color:var(--h);margin:0 0 4px;font-size:19px}
.lc p{margin:0;font-size:12.5px;opacity:.75}
.lc.hole{background:var(--rose)}[data-theme="dark"] .lc.hole{background:var(--rose2)}

.backdrop{display:none;position:absolute;inset:0;z-index:25;background:rgba(0,0,0,.16)}
.backdrop.on{display:block}
.dd{display:none;position:absolute;z-index:26;left:10px;right:auto;top:46px;background:var(--paper);border:1px solid var(--line);padding:10px;border-radius:14px;box-shadow:0 14px 36px rgba(0,0,0,.2);min-width:200px}
.dd.on{display:block}
.dd-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;max-height:240px;overflow-y:auto}
.dd-grid.one{grid-template-columns:1fr}
.dd-grid button{border:1px solid var(--line);background:var(--win);color:var(--text);border-radius:9px;padding:9px 10px;font:400 12px 'Inter';cursor:pointer;text-align:left}
.dd-grid button.act{background:var(--olive);color:#FAF9F6;border-color:var(--olive)}
[data-theme="dark"] .dd-grid button.act{background:var(--h);color:#2B2926}
</style>
</head>
<body>
<div class="app">
  <div class="paper-bg"></div>

  <header class="top">
    <div>
      <div class="logo"><span class="w">Ward</span><span class="b">Board</span></div>
      <div class="by">by @sea.laptev_</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="top-btn">🛍 <span>Wishlist</span></button>
      <button class="toggle" id="th">🌙</button>
    </div>
  </header>

  <div class="tabs" id="tabs">
    <button class="on" data-sec="closet">🧥 Шкаф</button>
    <button data-sec="box">💄 Шкатулка</button>
    <button data-sec="trip">✈ Поездка</button>
    <button data-sec="wish">⭐ Мечты</button>
    <button data-sec="guide">📖 Шпаргалка</button>
  </div>

  <div class="workspace">
    <div class="tools">
      <button data-tool="photo">📷<small>фото</small></button>
      <button data-tool="text">🅰<small>текст</small></button>
      <button data-tool="sticker">✨<small>стикер</small></button>
      <div class="sep"></div>
      <button data-tool="me">🧍<small>я</small></button>
      <div class="sep"></div>
      <button data-tool="undo">↶<small>назад</small></button>
      <button data-tool="redo">↷<small>вперёд</small></button>
      <div class="sep"></div>
      <button class="dl" data-tool="download">⬇<small>скачать</small></button>
    </div>

    <div class="stage">
      <div class="canvas" id="canvas">
        <div class="hint" id="chint"><span>🪞</span>чистый лист<br>работаешь с собой</div>
      </div>
    </div>

    <div class="drawer" id="drawer">
      <div class="dh-head">
        <div><div class="dh" id="d-title">Шкаф</div><div class="ds" id="d-sub">82 вещи</div></div>
        <button class="toggle" id="d-close" style="width:34px;height:34px">×</button>
      </div>
      <div class="toolbar" id="d-tools">
        <button class="dd-btn" data-dd="dd-cat"><span id="cat-label">📂 Все</span><span class="caret">▾</span></button>
        <button class="dd-btn" data-dd="dd-sort"><span id="sort-label">↕ Новые</span><span class="caret">▾</span></button>
        <button class="dd-btn" id="d-wear">☁ Не ношу</button>
        <button class="dd-btn" id="d-add">＋ Добавить</button>
      </div>
      <div class="body" id="d-body"></div>
    </div>

    <div class="backdrop" id="bd"></div>
    <div class="dd" id="dd-cat"><div class="dd-grid" id="cat-grid"></div></div>
    <div class="dd" id="dd-sort">
      <div class="dd-grid one">
        <button class="act" data-s="↕ Новые">↕ Сначала новые</button>
        <button data-s="↕ Старые">↕ Сначала старые</button>
        <button data-s="🎨 Цвет">🎨 По цвету</button>
        <button data-s="❤ Любимые">❤ По любимым</button>
      </div>
    </div>
  </div>

</div>

<script>
const SECTIONS={
  closet:{title:'Шкаф',sub:'82 вещи · авто-оцифровка',type:'grid',
    items:[['Бежевый трикотаж','Джемперы','sw1',false],['Оливковый жакет','Жакеты','sw2',false],['Розовый шёлк','Блузы','sw3',false],['Джинсы','Джинсы','sw4',false],['Графит брюки','Брюки','sw5',false],['Белая рубашка','Рубашки','sw6',false],['Серый худи','Спортивные','sw5',true],['Старая юбка','Юбки','sw4',true],['Платье','Платья','sw3',false],['Куртка','Куртки','sw2',false]]},
  box:{title:'Шкатулка',sub:'стикеры и дополнения',type:'grid',
    items:[['Тени для век','стикер','sw4',false],['Помада','стикер','sw3',false],['Платок','стикер','sw2',false],['Брошь','стикер','sw1',false],['Бант','стикер','sw5',false],['Цветы','стикер','sw6',false]]},
  trip:{title:'Поездка',sub:'Сочи 28.07',type:'list',
    items:[['Объёмный верх + узкий низ','баланс силуэта',false],['Принт верх — низ однотон','один акцент',false],['Цветовой блок сезона','олива · тофу · графит',false],['🛍 Wishlist · романтичная подпись','есть у inmark',true]]},
  wish:{title:'Мечты',sub:'карта желаний',type:'list',
    items:[['Шёлковая блуза с бантом','✓ в твоём wishlist',true],['Жакет мечта','из блога sea.laptev_',false],['Туфли','из магазина',false]]},
  guide:{title:'Шпаргалка',sub:'формулы',type:'list',
    items:[['1 · Объём × узкое','баланс силуэта',false],['2 · Принт × однотон','акцент рисунка',false],['3 · 3 цвета','олива·тофу·графит',false],['4 · Дорогая фактура','шёлк·кашемир·твид',false],['5 · Тихий акцент','подпись-платок',false]]}
};
const CATS=['Все','Платья','Юбки','Блузы','Рубашки','Джемперы','Футболки','Топы','Брюки','Джинсы','Спортивные','Шорты','Жакеты','Жилеты','Пальто','Пуховик','Куртки','Обувь','Сумки','Ремни','Платки','Украшения','Головные уборы','Купальники'];
let curCat='Все', onlyWear=false;

const catGrid=document.getElementById('cat-grid');
CATS.forEach((c,i)=>{const b=document.createElement('button');b.textContent=(i===0?'📂 ':'')+c;b.dataset.c=c;if(i===0)b.classList.add('act');catGrid.appendChild(b);});
catGrid.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{catGrid.querySelectorAll('button').forEach(x=>x.classList.remove('act'));b.classList.add('act');curCat=b.dataset.c;document.getElementById('cat-label').textContent=(b.dataset.c==='Все'?'📂 ':'')+b.dataset.c;closeDD();renderCloset();}));
document.querySelectorAll('#dd-sort button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('#dd-sort button').forEach(x=>x.classList.remove('act'));b.classList.add('act');document.getElementById('sort-label').textContent=b.dataset.s;closeDD();}));

const bd=document.getElementById('bd');
function closeDD(){document.querySelectorAll('.dd.on').forEach(d=>d.classList.remove('on'));bd.classList.remove('on');}
document.querySelectorAll('.dd-btn[data-dd]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();const m=document.getElementById(b.dataset.dd);const on=m.classList.contains('on');closeDD();if(!on){m.classList.add('on');bd.classList.add('on');}}));
bd.addEventListener('click',closeDD);

const drawer=document.getElementById('drawer');const dBody=document.getElementById('d-body');const tabBtns=document.querySelectorAll('#tabs button');const dWear=document.getElementById('d-wear');
function tileEl(it){
  const t=document.createElement('div');t.className='tile '+(it[2]||'sw1');if(it[3])t.classList.add('worn');t.innerHTML='<i>'+it[0]+(it[3]?' · ☁':'')+'</i>';
  t.addEventListener('click',()=>addToCanvas({type:'photo',cls:it[2],name:it[0]}));return t;
}
function renderCloset(){
  dBody.innerHTML='';
  const mc=document.createElement('div');mc.className='lc';mc.style.background='var(--rose)';
  mc.innerHTML='<h3>✨ Мари Кондо: оставь то, что радует</h3><p>благодари вещь и отпусти то, что больше не откликается</p>';
  dBody.appendChild(mc);
  const g=document.createElement('div');g.className='grid';
  SECTIONS.closet.items.filter(it=>{
    if(onlyWear && !it[3])return false;
    if(curCat!=='Все' && it[1]!==curCat)return false;
    return true;
  }).forEach(it=>g.appendChild(tileEl(it)));
  const add=document.createElement('div');add.className='tile add';add.innerHTML='<span>＋</span>добавить';g.appendChild(add);
  dBody.appendChild(g);
}
function openSection(key){
  const s=SECTIONS[key];
  document.getElementById('d-title').textContent=s.title;
  document.getElementById('d-sub').textContent=s.sub;
  dWear.style.display=(key==='closet')?'':'none';
  dBody.innerHTML='';
  if(key==='closet'){renderCloset();}
  else if(s.type==='grid'){
    const g=document.createElement('div');g.className='grid';
    s.items.forEach(it=>g.appendChild(tileEl(it)));
    const add=document.createElement('div');add.className='tile add';add.innerHTML='<span>＋</span>добавить';g.appendChild(add);
    dBody.appendChild(g);
  } else {
    s.items.forEach(it=>{const c=document.createElement('div');c.className='lc'+(it[2]?' hole':'');c.innerHTML='<h3>'+it[0]+'</h3><p>'+it[1]+'</p>';dBody.appendChild(c);});
  }
  tabBtns.forEach(b=>b.classList.toggle('on',b.dataset.sec===key));
  drawer.classList.add('on');
}
dWear.addEventListener('click',()=>{onlyWear=!onlyWear;dWear.classList.toggle('act-btn');dWear.style.background=onlyWear?'var(--olive)':'';dWear.style.color=onlyWear?'#FAF9F6':'';dWear.textContent=onlyWear?'☁ Не ношу (вкл)':'☁ Не ношу';renderCloset();});
tabBtns.forEach(b=>b.addEventListener('click',()=>{onlyWear=false;dWear.style.background='';dWear.style.color='';dWear.textContent='☁ Не ношу';openSection(b.dataset.sec);}));
document.getElementById('d-close').addEventListener('click',()=>{drawer.classList.remove('on');tabBtns.forEach(b=>b.classList.remove('on'));});

const canvas=document.getElementById('canvas');const chint=document.getElementById('chint');
let z=10,sel=null;
function clearHint(){if(chint)chint.style.display='none';}
function select(el){if(sel)sel.classList.remove('sel');sel=el;el.classList.add('sel');}
function oxform(o){o.style.transform=`rotate(${o.dataset.rot||0}deg) scale(${o.dataset.sc||1})`;}
function bindObj(o){const x=o.querySelector('.x');if(x)x.addEventListener('click',e=>{e.stopPropagation();o.remove();if(sel===o)sel=null;snapshot();});}
function mkObjNode(){
  const n=document.createElement('div');n.className='obj';
  const x=document.createElement('div');x.className='x';x.textContent='×';n.appendChild(x);
  n.dataset.sc=1;n.dataset.rot=0;
  return n;
}
function addToCanvas(o){
  clearHint();
  const n=mkObjNode();
  if(o.type==='photo'){const im=document.createElement('div');im.style.width='74px';im.style.height='98px';im.className='ph '+o.cls;n.appendChild(im);}
  else if(o.type==='text'){n.classList.add('txt');n.appendChild(document.createTextNode('текст'));}
  else if(o.type==='sticker'){n.classList.add('stk');n.textContent='✨';}
  else if(o.type==='me'){n.classList.add('stk');n.textContent='🧍';}
  n.style.left=(40+Math.random()*40)+'px';n.style.top=(40+Math.random()*50)+'px';n.style.zIndex=++z;
  bindObj(n);canvas.appendChild(n);select(n);snapshot();
}

/* multi-touch: 1 палец = двигать, 2 пальца = вращать+масштаб */
const pts=new Map();let drag=null,gest=null;
canvas.addEventListener('pointerdown',e=>{
  const o=e.target.closest('.obj');
  try{canvas.setPointerCapture(e.pointerId);}catch(_){}
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY,o});
  const arr=[...pts.values()];
  if(arr.length===2 && arr[0].o && arr[0].o===arr[1].o){
    select(arr[0].o);drag=null;
    const dx=arr[1].x-arr[0].x,dy=arr[1].y-arr[0].y;
    gest={o:arr[0].o,d0:Math.hypot(dx,dy)||1,a0:Math.atan2(dy,dx),sc:parseFloat(arr[0].o.dataset.sc||1),rt:parseFloat(arr[0].o.dataset.rot||0)};
  } else if(arr.length===1 && o){
    select(o);const r=canvas.getBoundingClientRect();
    drag={o,dx:e.clientX-r.left-parseFloat(o.style.left||0),dy:e.clientY-r.top-parseFloat(o.style.top||0)};
  } else if(!o){if(sel){sel.classList.remove('sel');sel=null;}}
});
canvas.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId))return;
  pts.set(e.pointerId,{...pts.get(e.pointerId),x:e.clientX,y:e.clientY});
  if(gest){const a=[...pts.values()];const dx=a[1].x-a[0].x,dy=a[1].y-a[0].y;let s=gest.sc*(Math.hypot(dx,dy)/gest.d0);s=Math.max(.3,Math.min(s,4));const r=gest.rt+(Math.atan2(dy,dx)-gest.a0)*180/Math.PI;gest.o.dataset.sc=s;gest.o.dataset.rot=r;oxform(gest.o);}
  else if(drag&&pts.size===1){const r=canvas.getBoundingClientRect();drag.o.style.left=(e.clientX-r.left-drag.dx)+'px';drag.o.style.top=(e.clientY-r.top-drag.dy)+'px';}
});
function endPt(e){const acted=gest||drag;pts.delete(e.pointerId);if(pts.size<2)gest=null;if(pts.size===0){drag=null;if(acted)snapshot();}}
canvas.addEventListener('pointerup',endPt);canvas.addEventListener('pointercancel',endPt);

/* undo / redo */
let hist=[[]],hi=0;
function snapshot(){
  const st=[...canvas.querySelectorAll('.obj')].map(o=>({l:o.style.left,t:o.style.top,sc:o.dataset.sc,rt:o.dataset.rot,html:o.innerHTML,cls:o.className.replace(' sel','')}));
  hist=hist.slice(0,hi+1);hist.push(st);hi=hist.length-1;
}
function restore(){
  [...canvas.querySelectorAll('.obj')].forEach(o=>o.remove());
  const st=hist[hi]||[];let last=null;
  st.forEach(s=>{const o=document.createElement('div');o.className=s.cls;o.innerHTML=s.html;o.style.left=s.l;o.style.top=s.t;if(s.sc){o.dataset.sc=s.sc;o.dataset.rt=s.rt;oxform(o);}bindObj(o);canvas.appendChild(o);last=o;});
  sel=null;clearHint();if(!st.length&&chint)chint.style.display='';
}

document.querySelectorAll('.tools button').forEach(b=>b.addEventListener('click',()=>{
  const t=b.dataset.tool;
  if(t==='photo')addToCanvas({type:'photo',cls:'sw1'});
  else if(t==='text')addToCanvas({type:'text'});
  else if(t==='sticker')addToCanvas({type:'sticker'});
  else if(t==='me')addToCanvas({type:'me'});
  else if(t==='undo'){if(hi>0){hi--;restore();}}
  else if(t==='redo'){if(hi<hist.length-1){hi++;restore();}}
  else if(t==='download'){alert('⬇ Скачать образ в PDF — скоро тут');}
}));

const th=document.getElementById('th');const root=document.documentElement;
const saved=localStorage.getItem('wb-theme');if(saved){root.dataset.theme=saved;th.textContent=saved==='dark'?'☀':'🌙';}
th.addEventListener('click',()=>{const d=root.dataset.theme==='dark'?'light':'dark';root.dataset.theme=d;localStorage.setItem('wb-theme',d);th.textContent=d==='dark'?'☀':'🌙';document.querySelector('meta[name=theme-color]').setAttribute('content',d==='dark'?'#2B2926':'#F4E3E6');});

openSection('closet');
</script>
